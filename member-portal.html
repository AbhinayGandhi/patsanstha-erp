  'एक्क्याऐंशी','ब्याऐंशी','त्र्याऐंशी','चौऱ्याऐंशी','पंच्याऐंशी','शहाऐंशी','सत्त्याऐंशी','अठ्ठ्याऐंशी','एकोणनव्वद','नव्वद',

function amountToMarathiWords(num){
  num = Math.round(Number(num||0));
  if (num <= 0) return 'शून्य रुपये फक्त';
  let n = num;
  const crore = Math.floor(n/10000000); n %= 10000000;
  const lakh = Math.floor(n/100000); n %= 100000;
  const thousand = Math.floor(n/1000); n %= 1000;
  const hundred = Math.floor(n/100); n %= 100;
  const rest = n;
  let parts = [];
  if (crore) parts.push(MR_ONES[crore] + ' कोटी');
  if (lakh) parts.push(MR_ONES[lakh] + ' लाख');
  if (thousand) parts.push(MR_ONES[thousand] + ' हजार');
  if (hundred) parts.push(hundred===1 ? 'शंभर' : (MR_ONES[hundred] + 'शे'));
  if (rest) parts.push(MR_ONES[rest]);
  return parts.join(' ') + ' रुपये फक्त';
}
function renderDenomTable(idPrefix){
  const rows = DENOM_LIST.map(d => `<tr>
      <td>${d.label}</td>
      <td><input type="number" min="0" id="${idPrefix}-${d.key}" placeholder="0" oninput="updateDenomTotal('${idPrefix}')" style="width:80px;padding:5px;text-align:right;"></td>
      <td style="text-align:right;" id="${idPrefix}-${d.key}-sub">₹0</td>
    </tr>`).join('');
  return `
    <table class="data-table" style="margin-top:6px;width:100%;font-size:12.5px;">
      <thead><tr><th>दर्शनी किंमत</th><th>नग (संख्या)</th><th>उप-बेरीज</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="2" style="text-align:right;font-weight:700;">एकूण (अंकी)</td><td style="text-align:right;font-weight:700;" id="${idPrefix}-grand">₹0</td></tr></tfoot>
    </table>
    <div style="font-size:11.5px;color:#777;margin-top:4px;" id="${idPrefix}-words">एकूण (अक्षरी): शून्य रुपये फक्त</div>
  `;
}
function updateDenomTotal(idPrefix){
  let total = 0;
  DENOM_LIST.forEach(d => {
    const inp = document.getElementById(`${idPrefix}-${d.key}`);
    const cnt = Number(inp && inp.value || 0);
    const sub = cnt * d.value;
    total += sub;
    const subEl = document.getElementById(`${idPrefix}-${d.key}-sub`);
    if (subEl) subEl.textContent = fmtMoney(sub);
  });
  const grandEl = document.getElementById(`${idPrefix}-grand`);
  if (grandEl) grandEl.textContent = fmtMoney(total);
  const wordsEl = document.getElementById(`${idPrefix}-words`);
  if (wordsEl) wordsEl.textContent = 'एकूण (अक्षरी): ' + amountToMarathiWords(total);
  if (typeof window['onDenomTotalChange_'+idPrefix] === 'function') window['onDenomTotalChange_'+idPrefix](total);
  return total;
}
function collectDenomBreakdown(idPrefix){
  const items = []; let total = 0;
  DENOM_LIST.forEach(d => {
    const inp = document.getElementById(`${idPrefix}-${d.key}`);
    const cnt = Number(inp && inp.value || 0);
    if (cnt > 0){ const sub = cnt*d.value; total += sub; items.push({label:d.label, value:d.value, count:cnt, subtotal:sub}); }
  });
  return { items, total };
}

}
['mousemove','keydown','click','scroll','touchstart'].forEach(evt =>

/* ---------- EMI कॅल्क्युलेटर — लॉगिनशिवाय, कोणालाही वापरता येईल ---------- */
function renderEmiCalculator(){
  c.innerHTML = `
    <div class="card">
      <h2 style="text-align:center;margin-top:0;">🧮 EMI कॅल्क्युलेटर</h2>
      <p style="font-size:12.5px;color:#777;text-align:center;">कर्ज घेण्यापूर्वी अंदाजे मासिक हप्ता (EMI) किती येईल ते बघा.</p>
      <div class="field"><label>कर्ज रक्कम (₹)</label><input id="emi-amt" type="number" placeholder="उदा. 100000"></div>
      <div class="field"><label>व्याजदर (वार्षिक %)</label><input id="emi-rate" type="number" step="0.1" placeholder="उदा. 10"></div>
      <div class="field"><label>मुदत (महिने)</label><input id="emi-months" type="number" placeholder="उदा. 36"></div>
      <button class="btn gold" id="emi-calc-btn">EMI काढा</button>
      <div id="emi-result" style="margin-top:16px;"></div>
    </div>
    <button class="link-btn" id="go-back-login">‹ लॉगिनकडे परत</button>
  `;
  document.getElementById('go-back-login').addEventListener('click', () => renderLogin());
  document.getElementById('emi-calc-btn').addEventListener('click', () => {
    const P = Number(document.getElementById('emi-amt').value);
    const annualRate = Number(document.getElementById('emi-rate').value);
    const n = Number(document.getElementById('emi-months').value);
    const resEl = document.getElementById('emi-result');
    if (!P || !annualRate || !n || P<=0 || annualRate<=0 || n<=0){
      resEl.innerHTML = '<div class="err">कृपया तिन्ही रकाने बरोबर भरा.</div>';
      return;
    }
    const r = annualRate / 12 / 100; // मासिक व्याजदर
    const emi = (P * r * Math.pow(1+r, n)) / (Math.pow(1+r, n) - 1);
    const totalPayment = emi * n;
    const totalInterest = totalPayment - P;
    resEl.innerHTML = `
      <div style="background:var(--cream);border-radius:8px;padding:16px;text-align:center;">
        <div style="font-size:12px;color:#777;">मासिक हप्ता (EMI)</div>
        <div style="font-size:26px;font-weight:700;color:var(--navy);">${fmtMoney(emi)}</div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:13px;">
        <div>एकूण व्याज: <b>${fmtMoney(totalInterest)}</b></div>
        <div>एकूण परतफेड: <b>${fmtMoney(totalPayment)}</b></div>
      </div>
      <p style="font-size:11px;color:#999;margin-top:10px;">* हा फक्त अंदाजे आकडा आहे (reducing-balance पद्धत) — प्रत्यक्ष EMI शाखेतून मंजूर होणाऱ्या अटींनुसार थोडा वेगळा असू शकतो.</p>
    `;
  });
}

function renderRegisterStep2(member){
  c.innerHTML = `
    <div class="card">
      <h2 style="text-align:center;margin-top:0;">नमस्कार, ${member.name}</h2>
      <p style="font-size:12.5px;color:#777;text-align:center;">आता स्वतःसाठी एक PIN ठरवा (पुढच्या वेळी लॉगिनसाठी वापराल).</p>

          <button type="button" onclick="togglePwdVisibility('rg-pin1', this)" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;">👁</button>
        </div>
      </div>
      <div class="field"><label>PIN पुन्हा टाका</label>
        <div style="position:relative;">
          <input id="rg-pin2" type="password" inputmode="numeric" maxlength="6" style="width:100%;box-sizing:border-box;padding-right:38px;">
          <button type="button" onclick="togglePwdVisibility('rg-pin2', this)" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:16px;">👁</button>
        </div>
      </div>
      <button class="btn gold" id="rg-final-btn">नोंदणी पूर्ण करा</button>
      <div class="err" id="rg-err"></div>
    </div>
  `;
  document.getElementById('rg-final-btn').addEventListener('click', async () => {
    const btn = document.getElementById('rg-final-btn');
    const errEl = document.getElementById('rg-err');
    const pin1 = document.getElementById('rg-pin1').value.trim();
    const pin2 = document.getElementById('rg-pin2').value.trim();
    if (pin1.length < 4 || pin1.length > 6 || !/^\d+$/.test(pin1)){ errEl.textContent = 'PIN फक्त 4-6 अंकी असावा.'; return; }
    if (pin1 !== pin2){ errEl.textContent = 'दोन्ही PIN जुळत नाहीत.'; return; }
    btn.disabled = true; btn.textContent = 'नोंदणी होत आहे...';
    const { data: signUpData, error: signUpErr } = await sb.auth.signUp({ email: synthEmail(member.member_no), password: pin1 });
    if (signUpErr){ errEl.textContent = 'नोंदणी अयशस्वी: ' + signUpErr.message; btn.disabled=false; btn.textContent='नोंदणी पूर्ण करा'; return; }
    // signUp नंतर लगेच सेशन मिळत नसेल (email confirmation चालू असल्यास) — म्हणून लगेच साइन-इन करून बघतो
    let session = signUpData.session;
    if (!session){
      const { data: signInData } = await sb.auth.signInWithPassword({ email: synthEmail(member.member_no), password: pin1 });
      session = signInData?.session;
    }
    if (!session){
      errEl.innerHTML = 'खातं तयार झालं, पण लगेच लॉगिन होऊ शकलं नाही — Supabase Dashboard → Authentication → Settings मध्ये "Confirm email" पर्याय बंद आहे का तपासा.';
      btn.disabled=false; btn.textContent='नोंदणी पूर्ण करा';
      return;
    }
    const { error: updErr } = await sb.from('members').update({ auth_user_id: session.user.id }).eq('id', member.id);
    if (updErr){ errEl.textContent = 'खातं तयार झालं, पण सभासदाशी जोडताना त्रुटी: ' + updErr.message; btn.disabled=false; btn.textContent='नोंदणी पूर्ण करा'; return; }
    await loadMemberAndShowDashboard();
  });
}

/* ---------- डॅशबोर्ड ---------- */
async function loadMemberAndShowDashboard(){
  c.innerHTML = '<div class="empty">लोड होत आहे...</div>';
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ renderLogin(); return; }
  const { data: member, error } = await sb.from('members')
    .select('id,member_no,name,mobile,branch_id,branches(name)').eq('auth_user_id', session.user.id).maybeSingle();
  if (error || !member){ renderLogin('खातं सापडलं नाही — पुन्हा नोंदणी करा किंवा शाखेशी संपर्क साधा.'); return; }
  CURRENT_MEMBER = member;
  logoutBtn.classList.remove('hidden');
  document.getElementById('tabbar').classList.remove('hidden');
  resetIdleTimer();
  setActiveTab('dashboard');
  renderDashboard();
}

document.getElementById('tabbar').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  stopQrScanner();
  setActiveTab(btn.dataset.tab);
  if (btn.dataset.tab === 'dashboard') renderDashboard();
  else if (btn.dataset.tab === 'send') renderSendMoney();
  else if (btn.dataset.tab === 'myqr') renderMyQR();
  else if (btn.dataset.tab === 'deposit') renderCashDepositRequest();
  else if (btn.dataset.tab === 'loanapp') renderLoanApplication();
  else if (btn.dataset.tab === 'grievance') renderGrievance();
  else if (btn.dataset.tab === 'standing') renderStandingInstructions();
  else if (btn.dataset.tab === 'cheque') renderChequebookRequest();
});
function setActiveTab(tab){
  document.querySelectorAll('#tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
}

/* ---------- कॅमेरा QR स्कॅनर ---------- */
let scannerStream = null, scannerLoopId = null;
async function startQrScanner(){
  const box = document.getElementById('scanner-box');
  const video = document.getElementById('scanner-video');
  const canvas = document.getElementById('scanner-canvas');
  const errEl = document.getElementById('sm-err');
  errEl.textContent = '';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    errEl.textContent = 'हा ब्राउझर/पान कॅमेरा वापरण्यास सक्षम नाही (हे पान https:// वरून उघडलेलं आहे का तपासा — file:// वरून कॅमेरा चालत नाही).';
    return;
  }
  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch(e){
    errEl.textContent = 'कॅमेरा उघडता आला नाही: ' + e.message + ' (परवानगी दिली आहे का तपासा)';
    return;
  }
  video.srcObject = scannerStream;
  video.play();
  box.classList.remove('hidden');
  document.getElementById('scanner-cancel').onclick = stopQrScanner;
  const ctx = canvas.getContext('2d');
  const tick = () => {
    if (!scannerStream) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data){
        document.getElementById('sm-to').value = code.data.trim();
        stopQrScanner();
        return;
      }
    }
    scannerLoopId = requestAnimationFrame(tick);
  };
  scannerLoopId = requestAnimationFrame(tick);
}
function stopQrScanner(){
  if (scannerLoopId) cancelAnimationFrame(scannerLoopId);
  scannerLoopId = null;
  if (scannerStream){ scannerStream.getTracks().forEach(t => t.stop()); scannerStream = null; }
  const box = document.getElementById('scanner-box');
  if (box) box.classList.add('hidden');
}

      </tr>`).join('') || '<tr><td colspan="6" class="empty">कुठलीही विनंती सापडली नाही.</td></tr>'}</tbody>
    </table>
  `;
  box.dataset.loaded = '1';
}
async function toggleCdHistory(){
  const box = document.getElementById('cd-history-box');
  if (!box) return;
  if (box.dataset.open === '1'){ box.style.display = 'none'; box.dataset.open = '0'; return; }
  box.style.display = '';
  box.dataset.open = '1';
  await loadCdHistory();
}
async function cancelCdRequest(id){
  if (!confirm('ही विनंती रद्द करायची आहे का? रद्द केल्यावर हा OTP वापरता येणार नाही.')) return;
  const { error } = await sb.from('cash_deposit_requests')
    .update({ status: 'cancelled' })
    .eq('id', id).eq('member_id', CURRENT_MEMBER.id).eq('status', 'pending');
  if (error){ alert('रद्द करता आलं नाही: ' + error.message); return; }
  sb.from('cash_deposit_audit_log').insert({
    request_id: id, action: 'cancelled', actor_type: 'member',
    actor_id: CURRENT_MEMBER.id, actor_name: CURRENT_MEMBER.name, details: {}
  }).then(()=>{});
  const otpBox = document.getElementById('cd-otp-box');
  if (otpBox) otpBox.innerHTML = '<div class="empty">ही विनंती रद्द केली गेली आहे. नवीन विनंतीसाठी वरील फॉर्म पुन्हा भरा.</div>';
  const historyBox = document.getElementById('cd-history-box');
  if (historyBox && historyBox.dataset.open === '1') loadCdHistory();
}

    </head><body>

    <div style="text-align:center;font-size:11px;color:#777;margin-top:-4px;margin-bottom:8px;">कुंभारगांव, ता. पाटण, जि. सातारा</div>
      <div class="sub">कुंभारगांव, ता. पाटण, जि. सातारा — कॅश डिपॉझिट पावती (सभासद प्रत)</div>
      <div class="row"><span>Receipt / Txn ID</span><b>${r.transaction_id||'-'}</b></div>
      <div class="row"><span>दिनांक/वेळ</span><b>${new Date(r.created_at).toLocaleString('en-IN')}</b></div>

      <div class="row"><span>हेतू</span><b>${r.purpose||'-'}</b></div>
      <table><thead><tr><th>दर्शनी किंमत</th><th>नग</th><th>रक्कम</th></tr></thead><tbody>${denomRows || '<tr><td colspan="3">तपशील नाही</td></tr>'}</tbody></table>
      <div class="row"><span><b>एकूण रक्कम (अंकी)</b></span><b>${fmtMoney(r.amount)}</b></div>
      <div style="font-size:12px;margin:4px 0;"><b>एकूण (अक्षरी):</b> ${amountToMarathiWords(r.amount)}</div>

        new QRCode(document.getElementById('qr'), { text: ${JSON.stringify(qrPayload)}, width:120, height:120 });
        window.onload = () => setTimeout(() => window.print(), 300);

async function renderCashDepositRequest(){
  c.innerHTML = '<div class="empty">लोड होत आहे...</div>';
  const [{ data: accounts }, { data: branches }] = await Promise.all([
    sb.from('accounts').select('id,account_no,product_type,status').eq('member_id', CURRENT_MEMBER.id).eq('status','active').in('product_type',['savings','pigmy']),
    sb.from('branches').select('id,name').order('name')
  ]);
  const opts = (accounts||[]).map(a => `<option value="${a.id}">${a.account_no} (${a.product_type})</option>`).join('');
  const myBranchId = CURRENT_MEMBER.branch_id || '';
  const branchOpts = (branches||[]).map(b => `<option value="${b.id}" ${b.id===myBranchId?'selected':''}>${b.name}</option>`).join('');
  c.innerHTML = `
    <div class="card">
      <h2 style="text-align:center;margin-top:0;">💵 कॅश डिपॉझिट</h2>
      <p style="font-size:12.5px;color:#777;text-align:center;">खातं व माहिती भरा, तुमच्याकडील नोटा/नाणी मोजून त्यांची संख्या खाली भरा — एकूण रक्कम आपोआप मोजली जाईल. नंतर मिळणारा OTP कॅश-काउंटरवर सांगून पैसे जमा करा.</p>
      <div style="text-align:center;margin-bottom:10px;">
        <button class="btn ghost small" onclick="toggleCdHistory()" type="button">🕘 मागील विनंत्या पहा</button>
      </div>
      <div id="cd-history-box" style="display:none;margin-bottom:14px;"></div>
      ${!accounts || !accounts.length ? '<div class="empty">डिपॉझिटसाठी योग्य (बचत/पिग्मी) सक्रिय खातं सापडलं नाही.</div>' : `
        <div class="field"><label>कोणत्या खात्यात</label><select id="cd-account">${opts}</select></div>
        <div class="field"><label>जमा करायची शाखा</label><select id="cd-branch">${branchOpts || '<option value="">-- शाखा नाही --</option>'}</select></div>
        <div class="field"><label>जमा हेतू</label>
          <select id="cd-purpose" onchange="document.getElementById('cd-purpose-other-wrap').style.display=(this.value==='इतर')?'':'none';">
            <option value="बचत जमा">बचत जमा</option>
            <option value="पिग्मी हप्ता">पिग्मी हप्ता</option>
            <option value="कर्ज हप्ता">कर्ज हप्ता</option>
            <option value="इतर">इतर</option>
          </select>
        </div>
        <div class="field" id="cd-purpose-other-wrap" style="display:none;"><label>हेतू तपशील</label><input id="cd-purpose-other" type="text" placeholder="उदा. देणगी"></div>
        <div class="field"><label>अपेक्षित रक्कम (₹)</label><input id="cd-expected-amount" type="number" placeholder="जमा करायची एकूण रक्कम टाका" oninput="checkCdAmountMatch()"></div>
        <div class="field"><label>नोटा / नाणी मोजणी</label>${renderDenomTable('cd')}</div>
        <div id="cd-match-msg" style="font-size:12px;margin-top:4px;"></div>
        <div class="field"><label>टिप्पणी</label><textarea id="cd-remarks" rows="2" placeholder="काही नोंद असल्यास लिहा"></textarea></div>
        <button class="btn gold" id="cd-request-btn" style="margin-top:12px;">OTP मिळवा</button>
      `}
      <div class="err" id="cd-err"></div>
      <div id="cd-otp-box"></div>
    </div>
  `;
  window.onDenomTotalChange_cd = checkCdAmountMatch;
  const btn = document.getElementById('cd-request-btn');
  if (btn) btn.addEventListener('click', async () => {
    const errEl = document.getElementById('cd-err');
    errEl.textContent = '';
    const accountId = document.getElementById('cd-account').value;
    const branchId = document.getElementById('cd-branch').value || null;
    const purposeSel = document.getElementById('cd-purpose').value;
    const purposeOther = document.getElementById('cd-purpose-other').value.trim();
    const purpose = purposeSel === 'इतर' ? (purposeOther || 'इतर') : purposeSel;
    const remarks = document.getElementById('cd-remarks').value.trim();
    const expected = Number(document.getElementById('cd-expected-amount').value || 0);
    const { items, total } = collectDenomBreakdown('cd');
    if (!total || total <= 0){ errEl.textContent = 'किमान एका दर्शनी किमतीच्या नोटा/नाण्यांची संख्या भरा.'; return; }
    if (!expected || expected <= 0){ errEl.textContent = 'अपेक्षित रक्कम टाका.'; return; }
    if (expected !== total){ errEl.textContent = `अपेक्षित रक्कम (${fmtMoney(expected)}) आणि नोटा/नाणी मोजणीची एकूण रक्कम (${fmtMoney(total)}) जुळत नाही — कृपया पुन्हा तपासा.`; return; }
    if (purposeSel === 'इतर' && !purposeOther){ errEl.textContent = 'हेतू तपशील टाका.'; return; }
    btn.disabled = true; btn.textContent = 'तयार करत आहे...';
    const otp = String(Math.floor(100000 + Math.random()*900000));
    const { data, error } = await sb.from('cash_deposit_requests')
      .insert({ account_id: accountId, member_id: CURRENT_MEMBER.id, amount: total, otp, denomination: items, purpose, branch_id: branchId, remarks: remarks || null })
      .select('id, transaction_id').single();
    btn.disabled = false; btn.textContent = 'OTP मिळवा';
    if (error){ errEl.textContent = 'त्रुटी: ' + error.message; return; }
    sb.from('cash_deposit_audit_log').insert({
      request_id: data.id, action: 'request_created', actor_type: 'member',
      actor_id: CURRENT_MEMBER.id, actor_name: CURRENT_MEMBER.name,
      details: { amount: total, transaction_id: data.transaction_id, purpose }
    }).then(()=>{});
    document.getElementById('cd-otp-box').innerHTML = `
      <div style="background:var(--cream);border-radius:8px;padding:18px;text-align:center;margin-top:14px;">
        ${data.transaction_id ? `<div style="font-size:12px;color:#777;">Transaction ID</div><div style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:8px;">${data.transaction_id}</div>` : ''}
        <div style="font-size:12px;color:#777;">हा OTP कॅश-काउंटरवर सांगा</div>
        <div style="font-size:32px;font-weight:700;color:var(--navy);letter-spacing:4px;">${otp}</div>
        <div style="font-size:12px;color:#777;margin-top:6px;">एकूण रक्कम (अंकी): ${fmtMoney(total)}</div>
        <div style="font-size:12px;color:#777;">एकूण रक्कम (अक्षरी): ${amountToMarathiWords(total)}</div>
        <div id="cd-qr-box" style="margin:14px auto 6px;display:inline-block;padding:10px;background:#fff;border-radius:8px;"></div>
        <div style="font-size:11px;color:#999;">हा QR काउंटरवर स्कॅनरसमोर धरा — विनंती लगेच शोधली जाईल (OTP वेगळं सांगावंच लागेल)</div>
        <div style="margin-top:8px;">
          <button class="btn ghost small" id="cd-qr-download" type="button">QR डाउनलोड</button>
          <button class="btn ghost small" id="cd-qr-print" type="button">QR प्रिंट</button>
        </div>
        <div style="margin-top:8px;">
          <button class="btn ghost small" id="cd-cancel-now-btn" type="button" style="color:#b33;">ही विनंती रद्द करा</button>
        </div>
      </div>
      <p style="font-size:11px;color:#999;margin-top:10px;text-align:center;">काउंटरवर पैसे मोजून, तुम्ही भरलेली नोटा/नाणी संख्या पडताळून, OTP सांगितल्यावरच खात्यात जमा होईल.</p>
    `;
    if (window.QRCode){
      const qrPayload = JSON.stringify({ id: data.id, txn: data.transaction_id || '', amount: total, member: CURRENT_MEMBER.member_no });
      new QRCode(document.getElementById('cd-qr-box'), { text: qrPayload, width:160, height:160, colorDark:'#1B2A4A', colorLight:'#ffffff' });
      const getQrImgUrl = () => {
        const box = document.getElementById('cd-qr-box');
        const canvasEl = box.querySelector('canvas');
        const imgEl = box.querySelector('img');
        return canvasEl ? canvasEl.toDataURL('image/png') : (imgEl ? imgEl.src : null);
      };
      const dlBtn = document.getElementById('cd-qr-download');
      if (dlBtn) dlBtn.addEventListener('click', () => {
        const url = getQrImgUrl(); if (!url) return;
        const a = document.createElement('a'); a.href = url; a.download = (data.transaction_id || 'cash-deposit-qr') + '.png'; a.click();
      });
      const prBtn = document.getElementById('cd-qr-print');
      if (prBtn) prBtn.addEventListener('click', () => {
        const url = getQrImgUrl(); if (!url) return;
        const w = window.open('', '_blank');
        w.document.write(`<html><body style="text-align:center;padding:40px;font-family:sans-serif;"><img src="${url}"><p>${data.transaction_id||''} — ${fmtMoney(total)}</p></body></html>`);
        w.document.close(); w.focus(); w.print();
      });
    }
    const cancelNowBtn = document.getElementById('cd-cancel-now-btn');
    if (cancelNowBtn) cancelNowBtn.addEventListener('click', () => cancelCdRequest(data.id));
  });
}
function checkCdAmountMatch(){
  const msgEl = document.getElementById('cd-match-msg');
  if (!msgEl) return;
  const expected = Number(document.getElementById('cd-expected-amount').value || 0);
  const total = collectDenomBreakdown('cd').total;
  if (!expected || !total){ msgEl.textContent = ''; return; }
  if (expected === total){
    msgEl.innerHTML = `<span style="color:#2a7a2a;">✓ अपेक्षित रक्कम आणि नोटा/नाणी मोजणी जुळते.</span>`;
  } else {
    msgEl.innerHTML = `<span style="color:#b33;">⚠ जुळत नाही — फरक: ${fmtMoney(Math.abs(expected-total))}</span>`;
  }
}

async function bootstrap(){
  const { data: { session } } = await sb.auth.getSession();
  if (session){ await loadMemberAndShowDashboard(); }
  else { CURRENT_MEMBER = null; logoutBtn.classList.add('hidden'); document.getElementById('tabbar').classList.add('hidden'); renderLogin(); }
}
window.addEventListener('pageshow', (e) => { if (e.persisted) bootstrap(); }); // ब्राउझर bfcache मधून पान परत आलं तर ताजी तपासणी
bootstrap();
